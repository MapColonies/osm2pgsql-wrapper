{{- $releaseName := .Release.Name -}}
{{- $chartName := include "osm2pgsql-wrapper.name" . -}}
{{- $cloudProviderFlavor := include "osm2pgsql-wrapper.cloudProviderFlavor" . -}}
{{- $cloudProviderDockerRegistryUrl := include "osm2pgsql-wrapper.cloudProviderDockerRegistryUrl" . -}}
{{- $cloudProviderImagePullSecretName := include "osm2pgsql-wrapper.cloudProviderImagePullSecretName" . -}}
{{- $imageTag := include "osm2pgsql-wrapper.tag" . -}}
{{- if and (.Values.enabled) (.Values.job.enabled) -}}
{{- if .Values.deployment.enabled -}}
{{ fail "only one of 'job'/'deployment' can be enabled at the same time" }}
{{- end -}}
apiVersion: {{ .Values.job.apiVersion | quote }}
kind: Job
metadata:
  name: {{ printf "%s-job" (include "osm2pgsql-wrapper.fullname" .) }}
  labels:
    app: {{ $chartName }}
    component: {{ $chartName }}
    environment: {{ include "osm2pgsql-wrapper.environment" . }}
    release: {{ $releaseName }}
    {{- include "osm2pgsql-wrapper.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        app: {{ $chartName }}
        release: {{ $releaseName }}
        run: {{ $releaseName }}-{{ $chartName }}
        {{- include "osm2pgsql-wrapper.selectorLabels" . | nindent 8 }}
      annotations:
      {{- if .Values.resetOnConfigChange }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
      {{- if .Values.podAnnotations }}
      {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      {{- $needsFetchDump := and (eq .Values.cli.command "create") (eq .Values.cli.create.dumpSourceType "local-file") }}
      {{- $needsPrimaryKeyFix := and (eq .Values.cli.command "create") (gt (len .Values.cli.create.primaryKeys) 0) }}
      {{- if or $needsFetchDump $needsPrimaryKeyFix }}
      initContainers:
        {{- if $needsFetchDump }}
        # loadDump() (createManager.ts) only knows local-file/remote-url/dump-server --
        # there is no S3 case, so the app itself cannot pull the pbf out of a bucket. This
        # initContainer does it instead: fetch from MinIO into a volume shared with the
        # main container, at the exact path cli.create.dumpSource points "local-file" at.
        - name: fetch-dump
          image: {{ .Values.cli.create.mcImage }}
          command:
            - sh
            - -c
            - |
              mc alias set src {{ .Values.s3.protocol }}://{{ .Values.s3.host }}:{{ .Values.s3.port }} {{ .Values.s3.accessKey }} {{ .Values.s3.secretKey }} >/dev/null
              mc cp src/{{ .Values.s3.bucketName }}/{{ .Values.cli.create.s3DumpKey }} {{ .Values.cli.create.dumpSource }}
          volumeMounts:
            - name: dump-data
              mountPath: {{ dir .Values.cli.create.dumpSource }}
        {{- end }}
        {{- if $needsPrimaryKeyFix }}
        # Runs the actual `create` step as an initContainer instead of the main container --
        # see the primary-keys container below (in `containers:`) for why.
        {{- include "osm2pgsql-wrapper.appContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        {{- if $needsPrimaryKeyFix }}
        # osm2pgsql's flex output (see cli.create.primaryKeys' own comment in values.yaml)
        # creates these tables with no primary key, which makes every one of them
        # read-only over WFS -- see main README's "schema fix: all four tables were
        # read-only over WFS". `create` drops and recreates the tables from scratch every
        # run, so the fix has to be re-applied every run too, right after -- not a one-off
        # migration. This has to be the Job's main container, not a step tacked onto the
        # app container's own entrypoint (which is the compiled app binary, not a shell),
        # and it has to run after `create` finishes, which is exactly what moving the app
        # container up into `initContainers:` above buys: Kubernetes runs initContainers
        # to completion, in order, before any container in `containers:` starts.
        - name: {{ $releaseName }}-{{ $chartName }}-primary-keys
          image: {{ .Values.cli.create.primaryKeysImage }}
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | default 5432 | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgres.password | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              {{- range .Values.cli.create.primaryKeys }}
              echo "=== adding primary key: {{ .table }}({{ .column }}) ==="
              psql -v ON_ERROR_STOP=1 -c "ALTER TABLE public.{{ .table }} ADD PRIMARY KEY ({{ .column }});"
              {{- end }}
        {{- else }}
        {{- include "osm2pgsql-wrapper.appContainer" . | nindent 8 }}
        {{- end }}
      volumes:
        # NOTE: this chart used to define an unconditional `nginx-config` volume backed by
        # a ConfigMap named 'nginx-extra-configmap'. Nothing ever mounted it, but a
        # non-optional configMap volume still has to resolve, so on any cluster without
        # that ConfigMap the pod never started -- it sat in ContainerCreating with
        # `FailedMount: configmap "nginx-extra-configmap" not found`. Removed.
        {{- if .Values.caSecretName }}
        - name: root-ca
          secret:
            secretName: {{ .Values.caSecretName }}
        {{- end }}
        {{- if .Values.extraVolumes -}}
          {{ tpl (toYaml .Values.extraVolumes) . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.cli.command "append" }}
        - name: config-schema
          configMap:
            name: {{ $releaseName }}-{{ $chartName }}-schema-configmap
        {{- end }}
        {{- if and (eq .Values.cli.command "create") (eq .Values.cli.create.dumpSourceType "local-file") }}
        - name: dump-data
          emptyDir: {}
        {{- end }}
        {{- if .Values.postgres.sslAuth.enabled }}
        - name: postgres-cert-conf
          secret:
            secretName: {{ .Values.postgres.sslAuth.secretName }}
        {{- end }}
        {{- if .Values.pgboss.sslAuth.enabled }}
        - name: pgboss-cert-conf
          secret:
            secretName: {{ .Values.pgboss.sslAuth.secretName }}
        {{- end }}
{{- end -}}
